# devices/mars/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word, and the device's page (docs/devices/mars.md) is made from it, so that the status is said in one place.

device mars
	title       Xiaomi 11 Pro
	vendor      Xiaomi
	soc         lahaina
	defconfig   mars_defconfig
	maintainer  coldreset (README.md)
	status      display     works     the panel through UEFI's framebuffer; frames drawn by the GPU with gpu=1
	status      touch       works     ST FingerTip FTM5 on SPI: taps and drags (CONFIG_HAKIOS_FOCALTECH, touchscreen=1); home-swipe classification still rough
	status      cpu         works     all 8 cores (cpus=8); A78/X1 at their top OPP with cpufreq=1
	status      gpu         works     Adreno 660, all 21 bring-up steps; OpenGL ES through Mesa freedreno (gpu=1 adreno_nomeasure=1)
	status      storage     partial   the system image is resident in RAM; var_store / UFS writes not enabled
	status      buttons     missing   the driver is in the tree, off in this device's config
	status      battery     missing   the driver is in the tree, off in this device's config
	status      thermal     missing   the driver is in the tree, off in this device's config
	status      wifi        missing   the driver is in the tree, off in this device's config
	status      audio       missing   the driver is in the tree, off in this device's config
	status      camera      missing   the driver is in the tree, off in this device's config
